
name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping events table
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_APIKEY }}
        run: |
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          curl --fail --silent --show-error \
            "$BASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
